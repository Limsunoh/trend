# 로컬 PC의 Postgres를 쓰고 싶을 때 사용
# 사용법: docker compose -f docker-compose.yml -f docker-compose.localdb.yml up -d redis web celery_worker celery_beat
# (db 서비스는 띄우지 않음)

services:
  web:
    environment:
      DB_HOST: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    environment:
      DB_HOST: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    environment:
      DB_HOST: host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
