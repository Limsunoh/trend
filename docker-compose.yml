services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: limsunoh/trend:latest
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input --clear 2>/dev/null || true &&
             exec gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile - trend_analyzer.wsgi:application"
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/app/fixtures
      - ./certs:/app/certs
      - chroma_data:/app/chroma_db
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  celery_worker:
    image: limsunoh/trend:latest
    command: celery -A trend_analyzer worker -l info -E -Q celery,embedding --pool=solo
    volumes:
      - ./certs:/app/certs
      - chroma_data:/app/chroma_db
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery_beat:
    image: limsunoh/trend:latest
    command: celery -A trend_analyzer beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  chroma_data:
